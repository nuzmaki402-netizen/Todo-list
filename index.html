<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1 class="app-title">Premium Tasks</h1>
            <div class="stats-container">
                <span class="total-tasks">Total: <span id="total-count">0</span></span>
                <span class="completed-tasks">Completed: <span id="completed-count">0</span></span>
            </div>
        </header>

        <div class="input-section">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="task-input" 
                    placeholder="Add a new task..." 
                    maxlength="100"
                >
                <button id="add-btn" class="add-button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <div class="tasks-container" id="tasks-container">
            <!-- Tasks will be dynamically added here -->
            <div class="empty-state" id="empty-state">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#00ADB5" stroke-width="1.5">
                    <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <p>No tasks yet. Add your first task!</p>
            </div>
        </div>

        <div class="actions-bar">
            <button id="clear-completed" class="action-btn">Clear Completed</button>
            <button id="clear-all" class="action-btn danger">Clear All</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
